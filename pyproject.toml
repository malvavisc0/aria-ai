[project]
name = "aria-ai"
dynamic = ["version"]
description = "Aria - AI Assistant with web UI, CLI management, and local LLM support"
readme = "README.md"
authors = [
    { name = "Malvavisc0", email = "207609879+malvavisc0@users.noreply.github.com" },
]
requires-python = ">=3.12"
dependencies = [
    "chainlit",
    "chromadb",
    "markdownify",
    "httpx",
    "huggingface-hub",
    "imdbinfo",
    "langfuse",
    "llama-index",
    "llama-index-embeddings-openai-like",
    "llama-index-instrumentation",
    "llama-index-llms-openrouter",
    "llama-index-vector-stores-chroma",
    "loguru",
    "markitdown",
    "openinference-instrumentation-llama-index",
    "playwright",
    "pydantic",
    "pillow",
    "pypdfium2",
    "python-dotenv",
    "sqlalchemy",
    "typer",
    "yfinance",
    "youtube-transcript-api",
    "llama-index-embeddings-huggingface",
    "webserp",
]

[project.optional-dependencies]
gui = ["pyside6"]

[project.scripts]
aria = "aria:main"
ax = "aria.ax_cli:main"
aria-gui = "aria.gui:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "aria.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aria = [
    ".env.example",
    "chainlit.md",
    ".chainlit/config.toml",
    ".chainlit/translations/*.json",
    "public/*.css",
    "public/*.json",
    "public/*.png",
    "public/avatars/*.png",
]

[dependency-groups]
dev = [
    "basedpyright",
    "black",
    "flake8",
    "isort",
    "pre-commit",
    "ruff",
    "pyinstaller",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-xdist",
]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.basedpyright]
include = ["src/aria"]
exclude = ["src/aria/gui"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-n logical --dist loadscope --cov=src/aria --cov-report=term-missing"

[tool.coverage.run]
source = ["src/aria"]
branch = true
command_line = "-m pytest"

[tool.coverage.report]
show_missing = true
skip_covered = false
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

[tool.uv]
link-mode = "copy"
override-dependencies = ["onnxruntime; sys_platform != 'darwin'"]
# Pin torch to the CPU wheel from the PyTorch CPU index. Embeddings run on CPU
# by default (device="cpu" in get_embeddings_model). vLLM owns the GPU stack 
# in its own isolated venv (~/.aria/venvs/vllm). See docs/plan-cpu-torch.md.
#
# `unsafe-best-match` is required (not the default `first-index`): the PyTorch
# CPU index mirrors some pure-Python packages at STALE versions (e.g. certifi
# 2022 vs PyPI 2026), so first-index would freeze them years behind. With
# unsafe-best-match, torch resolves to its +cpu local-version wheel (highest)
# while non-torch packages pick the newest across both indexes (i.e. PyPI).
#
# This config applies to `uv sync`/`uv lock`/`uv run` on the source tree. It
# does NOT propagate to `uv pip install aria-ai` from PyPI (Docker builds), so
# the CUDA/ROCm images keep the GPU torch from their vLLM base image. The
# vLLM installer (scripts/vllm.py) passes `--no-config` to its `uv pip install`
# so this CPU index never leaks into vLLM's CUDA venv. The lite/arm64 Docker
# images use `--torch-backend cpu` on their `uv pip install` line instead.
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
