# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml — Deploy Aria from GitHub Container Registry
#
# Quick start (NVIDIA / CUDA):
#   docker compose up -d
#
# Prerequisites:
#   - Copy src/aria/.env.example (or a docs/env/ preset) to .env and configure
#   - NVIDIA: install nvidia-container-toolkit
#
# Note: ROCm is unsupported — local chat requires NVIDIA CUDA. The
# aria-lite / aria-arm64 services run without a GPU, so the mounted .env
# MUST set ARIA_VLLM_REMOTE=true together with CHAT_OPENAI_API /
# ARIA_VLLM_API_KEY / CHAT_MODEL, or `aria init` aborts on first boot.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Aria (CUDA / CPU — local vLLM) ───────────────────────────────────────
  aria:
    image: ghcr.io/malvavisc0/aria-ai-cuda:latest
    container_name: aria
    ports:
      - "${SERVER_PORT:-9876}:9876"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # ── Aria Lite (no GPU — remote LLM or CPU-only) ─────────────────────────
  # Usage: docker compose up -d aria-lite
  aria-lite:
    image: ghcr.io/malvavisc0/aria-ai-lite:latest
    container_name: aria-lite
    ports:
      - "${SERVER_PORT:-9876}:9876"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    restart: unless-stopped

  # ── Aria ARM64 (Raspberry Pi 4 — remote LLM or CPU-only) ────────────────
  # Usage: docker compose up -d aria-arm64
  aria-arm64:
    image: ghcr.io/malvavisc0/aria-ai-arm64:latest
    container_name: aria-arm64
    ports:
      - "${SERVER_PORT:-9876}:9876"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    restart: unless-stopped
