name: Release

# Triggered when a version tag is pushed (e.g. v0.1.0)
# or manually via the GitHub Actions UI.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write # needed to create GitHub Releases and upload assets
  id-token: write # needed for PyPI trusted publishing (OIDC)
  packages: write # needed to push Docker images to GHCR

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 0: Validate that the tag matches __version__ in __init__.py
  # ────────────────────────────────────────────────────────────────────────────
  validate-version:
    name: Validate version tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and compare versions
        run: |
          # Derive the tag (supports both push and workflow_dispatch)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          # Strip leading 'v' prefix
          TAG_VERSION="${TAG#v}"

          # Read __version__ from src/aria/__init__.py
          INIT_VERSION=$(python3 -c "
          import re, pathlib
          text = pathlib.Path('src/aria/__init__.py').read_text()
          match = re.search(r'^__version__\s*=\s*[\"]([^\"]+)[\"]', text, re.MULTILINE)
          print(match.group(1) if match else '')
          ")

          if [[ -z "${INIT_VERSION}" ]]; then
            echo "::error::Could not read __version__ from src/aria/__init__.py"
            exit 1
          fi

          echo "Tag version:     ${TAG_VERSION}"
          echo "__init__ version: ${INIT_VERSION}"

          if [[ "${TAG_VERSION}" != "${INIT_VERSION}" ]]; then
            echo "::error::Version mismatch! Tag '${TAG_VERSION}' != __version__ '${INIT_VERSION}'. Update src/aria/__init__.py before tagging."
            exit 1
          fi

          echo "✅ Versions match: ${TAG_VERSION}"

      # ─────────────────────────────────────────────────────────────────────
      # Cross-check: producer/consumer drift guard
      # ─────────────────────────────────────────────────────────────────────
      # The whisper CUDA asset is named in two places — this workflow (build,
      # upload, release) and src/aria/scripts/voice.py (download, fallback).
      # A drift silently makes the consumer 404 and fall back to CPU, which
      # is the exact failure this asset exists to avoid. Pin both sides to
      # the single constant below and assert they agree before any build.
      - name: Check whisper asset pin consistency
        run: |
          set -eu

          # The asset name this workflow produces and the consumer requests
          # MUST be identical. Single source of truth is the Python constant
          # _WHISPER_CUDA_ASSET in src/aria/scripts/voice.py; this workflow
          # must keep its own literal in sync (verified below) and the CUDA
          # toolkit version must match _MIN_CUDA_VERSION_FOR_GPU.
          CONSUMER_ASSET=$(python3 -c "
          import pathlib, re
          text = pathlib.Path('src/aria/scripts/voice.py').read_text()
          m = re.search(r'^_WHISPER_CUDA_ASSET\s*=\s*[\"]([^\"]+)[\"]', text, re.MULTILINE)
          assert m, 'could not read _WHISPER_CUDA_ASSET from voice.py'
          print(m.group(1))
          ")
          CONSUMER_MIN_CUDA=$(python3 -c "
          import pathlib, re, ast
          text = pathlib.Path('src/aria/scripts/voice.py').read_text()
          m = re.search(r'^_MIN_CUDA_VERSION_FOR_GPU\s*=\s*(\(.+?\))', text, re.MULTILINE)
          assert m, 'could not read _MIN_CUDA_VERSION_FOR_GPU from voice.py'
          major, minor = ast.literal_eval(m.group(1))
          print(f'{major}.{minor}')
          ")

          # Workflow-side pin (ASSET_NAME) is defined once here and reused
          # via $GITHUB_ENV across build-whisper-cuda and release.
          ASSET_NAME="whisper-server-cuda-12.6-x86_64.tar.gz"
          WORKFLOW_CUDA="12.6"

          echo "Consumer asset:  ${CONSUMER_ASSET}"
          echo "Workflow asset:  ${ASSET_NAME}"
          echo "Consumer min CUDA: ${CONSUMER_MIN_CUDA}"
          echo "Workflow CUDA:   ${WORKFLOW_CUDA}"

          if [[ "${ASSET_NAME}" != "${CONSUMER_ASSET}" ]]; then
            echo "::error::whisper asset name drift! workflow='${ASSET_NAME}' != voice.py='${CONSUMER_ASSET}'. Update _WHISPER_CUDA_ASSET in src/aria/scripts/voice.py to match."
            exit 1
          fi
          if [[ "${WORKFLOW_CUDA}" != "${CONSUMER_MIN_CUDA}" ]]; then
            echo "::error::CUDA version drift! workflow='${WORKFLOW_CUDA}' != voice.py min='${CONSUMER_MIN_CUDA}'. The '12.6' in the asset name and the CUDA toolkit pin must match _MIN_CUDA_VERSION_FOR_GPU."
            exit 1
          fi

  # ────────────────────────────────────────────────────────────────────────────
  # Job 1b: Lint — gates every artifact-producing job so a release never
  # ships when ruff is failing. Mirrors ci.yml's lint job exactly.
  # ────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    needs: validate-version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt update && sudo apt install -y libgl1 libglx-mesa0 libgl1-mesa-dri mesa-utils

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --group dev --all-extras

      - name: Ruff check
        run: uv run ruff check src/

      - name: Ruff format check
        run: uv run ruff format --check src/

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2: Build static CUDA whisper-server
  # ────────────────────────────────────────────────────────────────────────────
  build-whisper-cuda:
    name: Build whisper-server (CUDA, static)
    needs: [validate-version, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 180  # 8 CUDA archs (incl. PTX) raise build time vs 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Read asset name from voice.py (single source of truth)
        id: asset
        run: |
          ASSET_NAME=$(python3 -c "
          import pathlib, re
          text = pathlib.Path('src/aria/scripts/voice.py').read_text()
          m = re.search(r'^_WHISPER_CUDA_ASSET\s*=\s*[\"]([^\"]+)[\"]', text, re.MULTILINE)
          assert m, 'could not read _WHISPER_CUDA_ASSET from voice.py'
          print(m.group(1))
          ")
          echo "name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "Asset: ${ASSET_NAME}"

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.6.3"
          method: "network"
          sub-packages: '["nvcc", "libraries-dev"]'

      - name: Verify nvcc
        run: nvcc --version

      - name: Clone whisper.cpp
        run: |
          git clone --depth 1 --branch v1.9.2 \
            https://github.com/ggml-org/whisper.cpp /tmp/whisper.cpp

      - name: Prune non-server examples (v1.9.2 unconditionally builds all examples)
        run: |
          # v1.9.2's examples/CMakeLists.txt adds every example unconditionally;
          # WHISPER_BUILD_EXAMPLES=OFF would drop the server too (it lives under
          # examples/), so patch the file to keep only add_subdirectory(server).
          python3 - <<'PY'
          from pathlib import Path
          p = Path("/tmp/whisper.cpp/examples/CMakeLists.txt")
          text = p.read_text()
          lines = text.splitlines()
          keep = {"add_subdirectory(server)"}
          out = []
          for line in lines:
              stripped = line.strip()
              if stripped.startswith("add_subdirectory(") and stripped not in keep:
                  continue
              out.append(line)
          p.write_text("\n".join(out) + "\n")
          PY
          grep -n 'add_subdirectory(' /tmp/whisper.cpp/examples/CMakeLists.txt

      - name: Configure (static CUDA build)
        run: |
          # CUDA arch coverage. ggml's upstream default for CUDA < 13 is
          #   50-virtual 61-virtual 70-virtual 75-virtual 80-virtual 86-real 89-real 90-virtual
          # The previous "-DCMAKE_CUDA_ARCHITECTURES=75;80;86;89;90" dropped
          # Maxwell(50)/Pascal(61)/Volta(70), so users on those GPUs passed the
          # driver gate (CUDA >= 12.6), downloaded the build successfully (no
          # 404 → fallback never triggered), then got "no kernel image
          # available" at runtime. Here we use -virtual (PTX) for all 8
          # archs: PTX is forward-compatible (sm_90 PTX JITs to Blackwell
          # sm_100+), and the CUDA 12.6 driver (>=525) JITs PTX to near-
          # optimal SASS for every supported arch. A single -real/-virtual
          # mix would compile 86/89 to cubin (SASS), but the verification
          # step reads PTX from the fatbin via `strings`, which only sees
          # PTX — so PTX-everywhere keeps the build and the check in sync.
          cmake -S /tmp/whisper.cpp -B /tmp/whisper.cpp/build \
            -DGGML_CUDA=ON \
            -DGGML_CUDA_NO_VMM=ON \
            -DGGML_METAL=OFF \
            -DGGML_NATIVE=OFF \
            -DCMAKE_MESSAGE_LOG_LEVEL=VERBOSE \
            -DCMAKE_CUDA_ARCHITECTURES="50-virtual;61-virtual;70-virtual;75-virtual;80-virtual;86-virtual;89-virtual;90-virtual" \
            -DWHISPER_BUILD_SERVER=ON \
            -DWHISPER_BUILD_TESTS=OFF \
            -DGGML_BUILD_TESTS=OFF \
            -DGGML_BUILD_EXAMPLES=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_STATIC=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        # Cap parallelism: nvcc fattn-vec templates eat ~3-4 GB RAM each
        # across 8 CUDA architectures. Unbounded -j OOM-kills the runner.
        run: cmake --build /tmp/whisper.cpp/build --config Release -j2

      - name: Verify binary is static (no ggml .so deps)
        run: |
          ldd /tmp/whisper.cpp/build/bin/whisper-server | grep -i "ggml\|whisper" && exit 1 || true
          echo "Static binary confirmed"

      - name: Verify embedded CUDA archs (no silent runtime "no kernel image")
        # A user with a GPU whose arch is missing from the binary gets a
        # runtime "no kernel image available" — a silent failure the 404
        # fallback never catches. All archs are compiled as PTX (see the
        # Configure step), so `strings` finds the ".target sm_XX" markers
        # nvcc embeds in the fatbin ELF. This avoids depending on cuobjdump
        # (not shipped by the nvcc+libraries-dev sub-packages) and avoids
        # the -ptx/-real mismatch where -real cubins wouldn't show in PTX
        # output. Assert each configured arch is present so a future
        # regression (dropped arch, failed PTX compile) fails the build
        # instead of shipping a broken asset to CUDA users.
        run: |
          set -eu
          BIN=/tmp/whisper.cpp/build/bin/whisper-server
          strings "${BIN}" | grep -oE '\.target sm_[0-9]+' | sort -u | tee /tmp/archs.txt
          for arch in 50 61 70 75 80 86 89 90; do
            if ! grep -qE "sm_${arch}\b" /tmp/archs.txt; then
              echo "::error::CUDA arch sm_${arch} missing from binary — users on this arch get 'no kernel image available' at runtime. Check CMAKE_CUDA_ARCHITECTURES and the nvcc invocation."
              exit 1
            fi
          done
          echo "All 8 CUDA archs embedded ✅"

      - name: Package
        run: |
          tar -czf "${{ steps.asset.outputs.name }}" \
            -C /tmp/whisper.cpp/build/bin whisper-server

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.asset.outputs.name }}
          path: ${{ steps.asset.outputs.name }}
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2: Publish to PyPI using trusted publishing (OIDC)
  # ────────────────────────────────────────────────────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    needs: [validate-version, lint]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aria-ai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  # ────────────────────────────────────────────────────────────────────────────
  # Job 3: Build and push Docker images to GHCR
  # ────────────────────────────────────────────────────────────────────────────
  build-docker:
    name: "Build Docker (${{ matrix.label }})"
    needs: [validate-version, lint, publish-pypi]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "CUDA/CPU"
            base_image: "vllm/vllm-openai:latest"
            suffix: "-cuda"
            dockerfile: "Dockerfile"
          - label: "ROCm (AMD)"
            base_image: "vllm/vllm-openai-rocm:latest"
            suffix: "-rocm"
            dockerfile: "Dockerfile"
          - label: "Debian (lite)"
            base_image: ""
            suffix: "-lite"
            dockerfile: "Dockerfile.debian"
          - label: "ARM64 (Linux)"
            base_image: ""
            suffix: "-arm64"
            dockerfile: "Dockerfile.debian"
            platform: "linux/arm64"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform || 'linux/amd64' }}
          push: true
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/aria-ai${{ matrix.suffix }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/aria-ai${{ matrix.suffix }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────────────────────────────
  # Job 4: Create GitHub Release and attach the whisper artifact
  # ────────────────────────────────────────────────────────────────────────────
  # Decoupled from publish-pypi and build-docker: the whisper CUDA asset
  # is the sole reason this workflow exists (CUDA support). An unrelated
  # PyPI hiccup or a transient ROCm/lite Docker build failure must NOT
  # deny the CUDA build to every GPU user on this tag — that was the
  # failure mode under the old `needs: [build-whisper-cuda, publish-pypi,
  # build-docker]`, which coupled the asset to unrelated products. This
  # job depends only on the whisper build and the version validation.
  #
  # Works for both tag pushes (github.ref_name is the tag) and
  # workflow_dispatch (github.event.inputs.tag is the tag). Previously
  # dispatch never published a release — the `if: startsWith(github.ref,
  # 'refs/tags/')` gate skipped the job on a branch ref, and the version
  # step hardcoded GITHUB_REF_NAME (the branch name on dispatch), so the
  # asset would have attached to the wrong tag even if the gate were
  # removed. Now the tag is resolved consistently with validate-version.
  release:
    name: Create GitHub Release
    needs: [validate-version, lint, build-whisper-cuda]
    runs-on: ubuntu-latest
    if: >-
      ${{ startsWith(github.ref, 'refs/tags/')
      || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag (push or dispatch)
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Read asset name from voice.py (single source of truth)
        id: asset
        run: |
          ASSET_NAME=$(python3 -c "
          import pathlib, re
          text = pathlib.Path('src/aria/scripts/voice.py').read_text()
          m = re.search(r'^_WHISPER_CUDA_ASSET\s*=\s*[\"]([^\"]+)[\"]', text, re.MULTILINE)
          assert m, 'could not read _WHISPER_CUDA_ASSET from voice.py'
          print(m.group(1))
          ")
          echo "name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "Asset: ${ASSET_NAME}"

      - name: Download whisper CUDA artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.asset.outputs.name }}
          path: release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Aria ${{ steps.tag.outputs.tag }}"
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, 'alpha') || contains(steps.tag.outputs.tag, 'beta') || contains(steps.tag.outputs.tag, 'rc') }}
          files: |
            release-assets/${{ steps.asset.outputs.name }}
          body: |
            ## Aria ${{ steps.tag.outputs.tag }}

            ### pip

            ```bash
            pip install aria-ai==${{ steps.tag.outputs.version }}
            ```

            ### Docker

            ```bash
            # CUDA / CPU (local vLLM)
            docker run -p 9876:9876 \
              -v ./data:/app/data \
              --env-file .env \
              ghcr.io/malvavisc0/aria-ai-cuda:latest

            # ROCm (AMD GPUs)
            docker run -p 9876:9876 \
              -v ./data:/app/data \
              --env-file .env \
              ghcr.io/malvavisc0/aria-ai-rocm:latest

            # Lightweight — no GPU (remote LLM or CPU-only)
            docker run -p 9876:9876 \
              -v ./data:/app/data \
              --env-file .env \
              ghcr.io/malvavisc0/aria-ai-lite:latest

            # ARM64 — Raspberry Pi 4 (remote LLM or CPU-only)
            docker run -p 9876:9876 \
              -v ./data:/app/data \
              --env-file .env \
              ghcr.io/malvavisc0/aria-ai-arm64:latest
            ```

            ### First Run

            On first launch, Aria creates a `.env` file in the current directory
            with default configuration. Edit it to set your LLM API URLs and ports.
